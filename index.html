<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>固定资产管理系统 V13</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#1677ff;--success:#52c41a;--warning:#faad14;--danger:#ff4d4f;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text2:#666;--text3:#999;--border:#f0f0f0;--shadow:0 2px 8px rgba(0,0,0,0.06);--radius:12px;--rs:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-title{font-size:17px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:12px}
.header-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.role-bar{display:flex;background:#fff;padding:4px;margin:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow)}
.role-btn{flex:1;padding:8px 0;text-align:center;border:none;background:transparent;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .2s}
.role-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(22,119,255,0.3)}
.page{display:none;padding:0 12px 80px}.page.active{display:block}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.grid-menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.menu-item{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 12px;text-align:center;cursor:pointer;transition:transform .15s;border:none;width:100%}
.menu-item:active{transform:scale(0.96)}.menu-item .icon{font-size:28px;margin-bottom:8px;display:block}.menu-item .label{font-size:14px;font-weight:500;color:var(--text)}
.form-group{margin-bottom:14px}.form-label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;outline:none;transition:border .2s;background:#fff}
.form-input:focus,.form-select:focus{border-color:var(--primary)}.form-textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(0.97)}.btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-warning{background:var(--warning);color:#fff}.btn-block{width:100%}.btn-sm{padding:6px 12px;font-size:12px}.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}th{font-weight:600;color:var(--text2);background:#fafafa}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-pending{background:#fff7e6;color:#d46b08}.badge-approved{background:#f6ffed;color:#389e0d}.badge-rejected{background:#fff1f0;color:#cf1322}
.badge-inuse{background:#e6f7ff;color:#096dd9}.badge-idle{background:#f0f5ff;color:#1d39c4}.badge-repair{background:#fff7e6;color:#d46b08}.badge-scrap{background:#f5f5f5;color:#8c8c8c}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}.modal-content{background:#fff;border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}.modal-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center;cursor:pointer;transition:all .15s}
.stat-card:active{transform:scale(0.96)}.stat-num{font-size:24px;font-weight:700;color:var(--primary)}.stat-label{font-size:12px;color:var(--text2);margin-top:2px}
.chart-box{width:100%;height:250px}
.tabs{display:flex;background:#fff;border-radius:var(--rs);overflow:hidden;margin-bottom:12px;border:1px solid var(--border)}
.tab-item{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .2s}
.tab-item.active{background:var(--primary);color:#fff}
.approval-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.approval-item:last-child{border-bottom:none}
.approval-info{flex:1}.approval-title{font-weight:500;font-size:14px}.approval-meta{font-size:12px;color:var(--text3);margin-top:2px}.approval-actions{display:flex;gap:8px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}.search-bar input{flex:1}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;z-index:300;display:none;max-width:80%;text-align:center}
.toast.show{display:block;animation:fadeInOut 2s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.version-badge{position:fixed;bottom:8px;right:12px;background:rgba(0,0,0,0.5);color:#fff;padding:2px 8px;border-radius:8px;font-size:10px;z-index:50}
.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.image-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.image-thumb img{width:100%;height:100%;object-fit:cover}
.image-thumb .del-btn{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tree-l1{padding:10px 12px;background:#e6f7ff;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.tree-l2{padding:8px 12px 8px 32px;background:#fafafa;border-radius:4px;margin:2px 0;display:flex;align-items:center;justify-content:space-between}
.tree-l3{padding:6px 12px 6px 56px;color:var(--text2);display:flex;align-items:center;justify-content:space-between}
@media(min-width:768px){body{max-width:500px;margin:0 auto}}
</style>
</head>
<body>

<div class="header">
<div class="header-title">固定资产管理</div>
<div class="header-actions">
<button class="header-btn" onclick="goBack()" id="backBtn" style="display:none"><i class="fas fa-arrow-left"></i></button>
<button class="header-btn" onclick="showPage('profile')"><i class="fas fa-user"></i></button>
</div>
</div>

<div class="role-bar">
<button class="role-btn active" data-role="L1" onclick="switchRole('L1')">👤 员工</button>
<button class="role-btn" data-role="L2" onclick="switchRole('L2')">🔧 管理员</button>
<button class="role-btn" data-role="L3" onclick="switchRole('L3')">⚙️ 超管</button>
</div>

<!-- L1 HOME -->
<div class="page active" id="page-l1-home">
<div class="grid-menu">
<div class="menu-item" onclick="showPage('l1-apply')" style="border-top:3px solid #1677ff"><span class="icon">📋</span><span class="label">领用</span></div>
<div class="menu-item" onclick="showPage('l1-return')" style="border-top:3px solid #52c41a"><span class="icon">🔄</span><span class="label">归还</span></div>
<div class="menu-item" onclick="showPage('l1-repair')" style="border-top:3px solid #faad14"><span class="icon">🔧</span><span class="label">报修</span></div>
<div class="menu-item" onclick="showPage('l1-scrap')" style="border-top:3px solid #ff4d4f"><span class="icon">🗑️</span><span class="label">报废</span></div>
</div>
<div class="card" onclick="toggleMyAssets()" style="cursor:pointer">
<div class="card-title"><span>📦 我的领用</span><span id="myAssetsArrow" style="color:var(--text3);font-size:12px">展开 ▾</span></div>
<div id="myAssets" style="display:none"><div id="myAssetsList"></div></div>
</div>
<div class="card" onclick="toggleMyRequests()" style="cursor:pointer">
<div class="card-title"><span>📄 我的申请记录</span><span id="requestArrow" style="color:var(--text3);font-size:12px">展开 ▾</span></div>
<div id="myRequests" style="display:none"><div id="myRequestsList"></div></div>
</div>
</div>

<!-- L1 APPLY (三级分类+搜索) -->
<div class="page" id="page-l1-apply">
<div class="card">
<div class="card-title">📋 领用申请</div>
<div class="form-group"><label class="form-label">一级分类</label>
<select class="form-select" id="applyCatL1" onchange="onApplyCatL1Change()"><option value="">请选择一级分类</option></select></div>
<div class="form-group" id="applyCatL2Group" style="display:none"><label class="form-label">二级分类</label>
<select class="form-select" id="applyCatL2" onchange="onApplyCatL2Change()"><option value="">请选择二级分类</option></select></div>
<div class="form-group" id="applyCatL3Group" style="display:none"><label class="form-label">资产名称</label>
<input class="form-input" id="applyAssetSearch" placeholder="输入关键字搜索..." oninput="onApplyAssetSearch()" style="margin-bottom:4px">
<select class="form-select" id="applyCatL3" size="4"></select></div>
<div class="form-group"><label class="form-label">领用数量</label><input class="form-input" type="number" id="applyQty" value="1" min="1"></div>
<div class="form-group"><label class="form-label">用途</label><select class="form-select" id="applyPurpose"><option>日常办公</option><option>维修更换</option><option>项目使用</option><option>临时借用</option></select></div>
<div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="applyNote" placeholder="可选填写备注..."></textarea></div>
<button class="btn btn-primary btn-block" onclick="submitApply()">提交申请</button>
</div>
</div>

<!-- L1 RETURN (图片上传) -->
<div class="page" id="page-l1-return">
<div class="card">
<div class="card-title">🔄 归还资产</div>
<div class="form-group"><label class="form-label">资产编号</label><select class="form-select" id="returnAsset"><option value="">请选择已领用的资产</option></select></div>
<div class="form-group"><label class="form-label">资产状况</label><select class="form-select" id="returnCondition"><option>完好</option><option>损坏</option><option>有磨损</option></select></div>
<div class="form-group"><label class="form-label">📷 上传图片（最多9张，自动压缩）</label>
<div class="image-preview" id="returnImages"></div>
<button class="btn btn-sm btn-outline" onclick="document.getElementById('returnFileInput').click()">+ 添加图片</button>
<input type="file" id="returnFileInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event,'return')"></div>
<div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="returnNote" placeholder="可选填写备注..."></textarea></div>
<button class="btn btn-primary btn-block" onclick="submitReturn()">提交归还</button>
</div>
</div>

<!-- L1 REPAIR (图片上传) -->
<div class="page" id="page-l1-repair">
<div class="card">
<div class="card-title">🔧 报修申请</div>
<div class="form-group"><label class="form-label">资产编号</label><select class="form-select" id="repairAsset"><option value="">请选择资产</option></select></div>
<div class="form-group"><label class="form-label">📷 上传图片（最多9张，自动压缩）</label>
<div class="image-preview" id="repairImages"></div>
<button class="btn btn-sm btn-outline" onclick="document.getElementById('repairFileInput').click()">+ 添加图片</button>
<input type="file" id="repairFileInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event,'repair')"></div>
<div class="form-group"><label class="form-label">故障描述</label><textarea class="form-textarea" id="repairDesc" placeholder="请描述故障情况..."></textarea></div>
<div class="form-group"><label class="form-label">紧急程度</label><select class="form-select" id="repairUrgency"><option>普通</option><option>紧急</option><option>特急</option></select></div>
<button class="btn btn-primary btn-block" onclick="submitRepair()">提交报修</button>
</div>
</div>

<!-- L1 SCRAP (图片上传) -->
<div class="page" id="page-l1-scrap">
<div class="card">
<div class="card-title">🗑️ 报废申请</div>
<div class="form-group"><label class="form-label">资产编号</label><select class="form-select" id="scrapAsset"><option value="">请选择资产</option></select></div>
<div class="form-group"><label class="form-label">📷 上传图片（最多9张，自动压缩）</label>
<div class="image-preview" id="scrapImages"></div>
<button class="btn btn-sm btn-outline" onclick="document.getElementById('scrapFileInput').click()">+ 添加图片</button>
<input type="file" id="scrapFileInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event,'scrap')"></div>
<div class="form-group"><label class="form-label">报废原因</label><textarea class="form-textarea" id="scrapReason" placeholder="请说明报废原因..."></textarea></div>
<button class="btn btn-danger btn-block" onclick="submitScrap()">提交报废申请</button>
</div>
</div>

<!-- L2 HOME (可点击卡片) -->
<div class="page" id="page-l2-home">
<div class="stats-grid">
<div class="stat-card" onclick="jumpToAssetList('all')"><div class="stat-num" id="statTotal">0</div><div class="stat-label">资产总数</div></div>
<div class="stat-card" onclick="jumpToAssetList('在用')"><div class="stat-num" id="statInUse">0</div><div class="stat-label">在用</div></div>
<div class="stat-card" onclick="jumpToAssetList('闲置')"><div class="stat-num" id="statIdle">0</div><div class="stat-label">闲置</div></div>
<div class="stat-card" onclick="jumpToAssetList('维修中')"><div class="stat-num" id="statRepair" style="color:var(--warning)">0</div><div class="stat-label">维修中</div></div>
</div>
<div class="tabs">
<button class="tab-item active" onclick="switchL2Tab('dashboard',this)">📊 看板</button>
<button class="tab-item" onclick="switchL2Tab('approvals',this)">📝 审批</button>
<button class="tab-item" onclick="switchL2Tab('assets',this)">📦 台账</button>
<button class="tab-item" onclick="switchL2Tab('records',this)">📋 领用记录</button>
</div>
<div id="l2-dashboard">
<div class="card"><div class="card-title">📊 资产分类占比</div><div class="chart-box" id="chartCategory"></div></div>
<div class="card"><div class="card-title">📈 领用趋势</div><div class="chart-box" id="chartTrend"></div></div>
</div>
<div id="l2-approvals" style="display:none"><div class="card"><div class="card-title">📝 待审批 <span id="pendingCount" class="badge badge-pending">0</span></div><div id="approvalList"></div></div></div>
<div id="l2-assets" style="display:none">
<div class="card">
<div class="card-title">📦 资产台账</div>
<div class="search-bar"><input class="form-input" id="assetSearch" placeholder="搜索资产名称/编号/状态..." oninput="renderAssetTable()"><button class="btn btn-primary btn-sm" onclick="showAddAssetV13()">+ 新增</button></div>
<div class="table-wrap"><table><thead><tr><th>编号</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody id="assetTableBody"></tbody></table></div>
</div>
</div>
<div id="l2-records" style="display:none">
<div class="card"><div class="card-title">📋 领用记录</div><div id="recordFilters" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"></div><div id="recordList"></div></div>
</div>
</div>

<!-- L3 HOME -->
<div class="page" id="page-l3-home">
<div class="grid-menu" style="grid-template-columns:1fr 1fr">
<div class="menu-item" onclick="showPage('l3-locations')"><span class="icon">📍</span><span class="label">存放地点</span></div>
<div class="menu-item" onclick="showPage('l3-categories')"><span class="icon">📂</span><span class="label">资产分类</span></div>
<div class="menu-item" onclick="showPage('l3-approval-flow')"><span class="icon">🔀</span><span class="label">审批流配置</span></div>
<div class="menu-item" onclick="showPage('l3-audit')"><span class="icon">📜</span><span class="label">审计日志</span></div>
<div class="menu-item" onclick="showPage('l3-admin-mgmt')"><span class="icon">👥</span><span class="label">管理员设置</span></div>
</div>
</div>

<!-- L3 LOCATIONS -->
<div class="page" id="page-l3-locations">
<div class="card"><div class="card-title">📍 存放地点管理 <button class="btn btn-primary btn-sm" onclick="showAddLocation()">+ 新增</button></div><div id="locationList"></div></div>
</div>

<!-- L3 CATEGORIES (三级树形) -->
<div class="page" id="page-l3-categories">
<div class="card"><div class="card-title">📂 资产分类管理（三级） <button class="btn btn-primary btn-sm" onclick="showAddCategoryV13()">+ 新增</button></div><div id="categoryTreeList"></div></div>
</div>

<!-- L3 APPROVAL FLOW -->
<div class="page" id="page-l3-approval-flow">
<div class="card">
<div class="card-title">🔀 审批流配置</div>
<div class="form-group"><label class="form-label">资产分类</label><select class="form-select" id="flowCategory" onchange="onFlowCategoryChange()"></select></div>
<div id="flowConfigArea"></div>
<button class="btn btn-primary btn-block" onclick="saveFlowConfig()" style="margin-top:12px">保存配置</button>
</div>
</div>

<!-- L3 AUDIT -->
<div class="page" id="page-l3-audit">
<div class="card"><div class="card-title">📜 审计日志</div><div id="auditLogList"></div></div>
</div>

<!-- L3 ADMIN MANAGEMENT -->
<div class="page" id="page-l3-admin-mgmt">
<div class="card">
<div class="card-title">👥 管理员设置</div>
<div style="margin-bottom:16px">
<label class="form-label">👑 超管列表（拥有L3全部权限）</label><div id="superAdminList"></div>
<button class="btn btn-sm btn-primary" onclick="addSuperAdmin()" style="margin-top:8px">+ 添加超管</button>
</div>
<div>
<label class="form-label">🔧 管理员列表（拥有L2审批与台账权限）</label><div id="adminList"></div>
<button class="btn btn-sm btn-primary" onclick="addAdmin()" style="margin-top:8px">+ 添加管理员</button>
</div>
</div>
</div>

<!-- PROFILE -->
<div class="page" id="page-profile">
<div class="card">
<div class="card-title">👤 个人中心</div>
<div style="text-align:center;padding:20px 0">
<div style="width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px">艾</div>
<div style="font-size:16px;font-weight:600">艾培刚</div>
<div style="font-size:12px;color:var(--text3)">榕江恒鑫机动车检测站</div>
</div>
<div style="border-top:1px solid var(--border);padding-top:12px">
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">当前角色</span><span id="profileRole" style="font-weight:500">L1 - 员工</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">应用版本</span><span style="font-weight:500">v13</span></div>
</div>
</div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal-content" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<div class="version-badge">v13</div>

<script>
// ===== DATA LAYER =====
const DB_KEY='fixed_assets_db_v13';
const DEFAULT_CATEGORY_TREE = {

// ===== IMAGE UPLOAD (自动压缩, ≤9张) =====
const imageStores={return:[],repair:[],scrap:[]};
function compressImage(file,ms){
  return new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let md=1920,w=img.width,h=img.height;
        if(w>md||h>md){const rt=Math.min(md/w,md/h);w=Math.round(w*rt);h=Math.round(h*rt)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
        const tc=(q)=>{c.toBlob(b=>{if(b.size/1024<=ms||q<=0.1)resolve(b);else tc(q-0.15)},'image/jpeg',q)};
        tc(0.8);
      };img.src=e.target.result;
    };r.readAsDataURL(file);
  });
}
async function handleImageUpload(ev,st){
  const files=ev.target.files,arr=imageStores[st];
  const rl=9-arr.length;
  if(files.length>rl){showToast('最多还能上传 '+rl+' 张');return}
  for(const f of files){
    if(arr.length>=9)break;
    try{
      const cp=await compressImage(f,500);
      const r2=new FileReader();
      r2.onload=(e)=>{arr.push(e.target.result);renderImagePreview(st)};
      r2.readAsDataURL(cp);
    }catch(e){console.error('压缩失败',e)}
  }
  ev.target.value='';
}
function renderImagePreview(st){
  const arr=imageStores[st],c=document.getElementById(st+'Images');
  if(!c)return;
  c.innerHTML=arr.map((img,i)=>'<div class="image-thumb"><img src="'+img+'"><button class="del-btn" onclick="removeImage(\''+st+'\','+i+')">✕</button></div>').join('');
}
function removeImage(st,i){imageStores[st].splice(i,1);renderImagePreview(st)}

// ===== NAVIGATION =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById('page-'+id);
  if(el)el.classList.add('active');
  currentPage=id;
  document.getElementById('backBtn').style.display=(id!==currentRole.toLowerCase()+'-home'&&id!=='l1-home')?'flex':'none';
  refreshPage(id);
}
function goBack(){showPage(currentRole.toLowerCase()+'-home')}

// ===== PERMISSION SYSTEM =====
function checkPerm(){
  const db=getDB(),user='艾培刚';
  if(!db.permissions)db.permissions={admins:[],superAdmins:['艾培刚']};
  const sa=db.permissions.superAdmins.includes(user);
  return{isSuperAdmin:sa,isAdmin:sa||db.permissions.admins.includes(user),isEmployee:true};
}// ===== SWITCH ROLE (权限控制) =====
function switchRole(r){
  const perm=checkPerm();
  if(r==='L3'&&!perm.isSuperAdmin){showToast('您没有超管权限');return}
  if(r==='L2'&&!perm.isAdmin){showToast('您没有管理员权限');return}
  currentRole=r;
  document.querySelectorAll('.role-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.role===r);
    const role=b.dataset.role;
    if(role==='L3')b.style.display=perm.isSuperAdmin?'block':'none';
    else if(role==='L2')b.style.display=perm.isAdmin?'block':'none';
    else b.style.display='block';
  });
  const n={L1:'员工',L2:'管理员',L3:'超管'};
  document.getElementById('profileRole').textContent=r+' - '+(n[r]||'');
  showPage(r.toLowerCase()+'-home');
}

// ===== TOAST =====
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ===== L1: RETURN (磨损联动) =====
function submitReturn(){
  const aid=document.getElementById('returnAsset').value,cond=document.getElementById('returnCondition').value,note=document.getElementById('returnNote').value;
  if(!aid){showToast('请选择资产');return}
  if(cond==='有磨损'){
    openModal('<div class="modal-title">⚠️ 资产有磨损<button class="modal-close" onclick="closeModal()">✕</button></div><p style="color:var(--text2);margin-bottom:16px">该资产有磨损，请选择处理方式：</p><button class="btn btn-warning btn-block" style="margin-bottom:8px" onclick="processWearRepair('+aid+',\''+note+'\')">🔧 送修</button><button class="btn btn-danger btn-block" onclick="processWearScrap('+aid+',\''+note+'\')">🗑️ 报废</button>');
    return;
  }
  processReturn(aid,cond,note);
}
function processReturn(aid,cond,note){
  const db=getDB(),asset=db.assets.find(x=>x.id===parseInt(aid));
  db.approvals.push({id:db.nextApprovalId++,type:'归还',assetId:parseInt(aid),condition:cond,note,images:imageStores.return.slice(),applicant:'艾培刚',status:'待审批',time:new Date().toLocaleString('zh-CN'),createdAt:Date.now()});
  addAuditLog(db,'提交归还申请','资产:'+(asset?asset.name:'')+',状况:'+cond);
  if(cond==='损坏'){
    db.approvals.push({id:db.nextApprovalId++,type:'报修',assetId:parseInt(aid),desc:'归还时发现损坏，自动生成报修申请',applicant:'艾培刚',status:'待审批',time:new Date().toLocaleString('zh-CN'),createdAt:Date.now()});
    showToast('归还已提交，因损坏自动生成报修申请 🔧');
  }else showToast('归还申请已提交 ✅');
  imageStores.return=[];renderImagePreview('return');
  saveDB(db);document.getElementById('returnNote').value='';goBack();
}
function processWearRepair(aid,note){
  closeModal();const db=getDB(),asset=db.assets.find(x=>x.id===parseInt(aid));
  db.approvals.push({id:db.nextApprovalId++,type:'归还',assetId:parseInt(aid),condition:'有磨损',note,images:imageStores.return.slice(),applicant:'艾培刚',status:'待审批',time:new Date().toLocaleString('zh-CN'),createdAt:Date.now()});

  addAuditLog(db,'归还+自动报修','资产:'+(asset?asset.name:'')+',磨损送修');
  imageStores.return=[];renderImagePreview('return');
  saveDB(db);showToast('归还已提交，已自动生成报修申请 🔧');
  document.getElementById('returnNote').value='';goBack();
}
function processWearScrap(aid,note){

// ===== L2: CHARTS =====
function renderCharts(){renderCategoryChart();renderTrendChart()}
function renderCategoryChart(){
  const db=getDB(),el=document.getElementById('chartCategory');
  if(!el)return;
  const map={};db.assets.forEach(a=>{map[a.category]=(map[a.category]||0)+1});
  const data=Object.entries(map).map(([k,v])=>({name:k,value:v}));
  if(data.length===0){el.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text3)">暂无资产数据</div>';return}
  const chart=echarts.init(el);
  chart.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['30%','60%'],center:['50%','40%'],data,label:{fontSize:11},itemStyle:{borderRadius:4}}]});
  window.addEventListener('resize',()=>chart.resize());
}
function renderTrendChart(){
  const db=getDB(),el=document.getElementById('chartTrend');
  if(!el)return;
  const map={};db.approvals.filter(a=>a.type==='领用').forEach(a=>{const d=a.time.slice(0,10);map[d]=(map[d]||0)+1});
  const dates=Object.keys(map).sort(),values=dates.map(d=>map[d]);
  if(dates.length===0){el.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text3)">暂无领用数据</div>';return}
  const chart=echarts.init(el);
  chart.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:dates,axisLabel:{fontSize:10}},yAxis:{type:'value'},series:[{type:'line',data:values,smooth:true,lineStyle:{color:'#1677ff',width:2},areaStyle:{color:'rgba(22,119,255,0.1)'},itemStyle:{color:'#1677ff'}}]});
  window.addEventListener('resize',()=>chart.resize());
}

  document.getElementById('pendingCount').textContent=pending.length;

function approve(id){
  const db=getDB(),idx=db.approvals.findIndex(a=>a.id===id);
  if(idx===-1)return;
  const a=db.approvals[idx];a.status='已通过';a.approvedAt=Date.now();a.approvedBy='管理员';
  const asset=db.assets.find(x=>x.id===a.assetId);
  if(asset&&a.type==='领用')asset.status='在用';
  if(asset&&a.type==='报修')asset.status='维修中';
  if(asset&&a.type==='报废')asset.status='已报废';
  if(asset&&a.type==='归还')asset.status='闲置';
  addAuditLog(db,'审批通过',a.type+'申请 #'+a.id);
  saveDB(db);showToast('已通过 ✅');
  renderApprovals();renderAssetTable();updateStats();
}
function reject(id){
  const db=getDB(),idx=db.approvals.findIndex(a=>a.id===id);
  if(idx===-1)return;
  const a=db.approvals[idx];a.status='已拒绝';a.rejectedAt=Date.now();a.rejectedBy='管理员';
  addAuditLog(db,'审批拒绝',a.type+'申请 #'+a.id);
  saveDB(db);showToast('已拒绝');renderApprovals();
}

// ===== L2: ASSET TABLE =====
function renderAssetTable(){
  const db=getDB(),q=document.getElementById('assetSearch').value.toLowerCase();
  let list=db.assets;
  if(q){
    const nameMatch=list.filter(a=>a.name.toLowerCase().includes(q)||a.code.toLowerCase().includes(q));
    const statusMatch=list.filter(a=>a.status.includes(q));
    list=[...new Set([...nameMatch,...statusMatch])];
  }
  const tbody=document.getElementById('assetTableBody');
  if(list.length===0){tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:30px 0">暂无资产数据</td></tr>';return}
  const sm={'在用':'badge-inuse','闲置':'badge-idle','备用':'badge-idle','维修中':'badge-repair','已报废':'badge-scrap'};
  tbody.innerHTML=list.map(a=>'<tr><td>'+a.code+'</td><td>'+a.name+'</td><td><span class="badge '+(sm[a.status]||'badge-idle')+'">'+a.status+'</span></td><td><button class="btn btn-sm btn-outline" onclick="editAsset('+a.id+')">编辑</button><button class="btn btn-sm btn-primary" onclick="printAssetLabel('+a.id+')" style="margin-left:4px">🖨️</button></td></tr>').join('');

async function handleAssetImageUpload(ev){
  const files=ev.target.files,rl=9-newAssetImages.length;
  if(files.length>rl){showToast('最多还能上传 '+rl+' 张');return}
  for(const f of files){
    if(newAssetImages.length>=9)break;
    try{
      const cp=await compressImage(f,500);
      const r2=new FileReader();
      r2.onload=(e)=>{newAssetImages.push(e.target.result);renderAssetImagePreview()};
      r2.readAsDataURL(cp);
    }catch(e){console.error('压缩失败',e)}
  }
  ev.target.value='';
}
function renderAssetImagePreview(){
  const c=document.getElementById('assetImages');
  if(!c)return;
  c.innerHTML=newAssetImages.map((img,i)=>'<div class="image-thumb"><img src="'+img+'"><button class="del-btn" onclick="removeAssetImage('+i+')">✕</button></div>').join('');

function saveNewCategoryV13(){
  const level=parseInt(document.getElementById('newCatLevel').value),name=document.getElementById('newCatName').value.trim();
  if(!name){showToast('请输入分类名称');return}
  const db=getDB();if(!db.categoryTree)db.categoryTree={};
  if(level===1){db.categoryTree[name]={}}
  else if(level===2){
    const p=document.getElementById('newCatParent').value;
    if(!p){showToast('请选择所属一级分类');return}
    if(!db.categoryTree[p])db.categoryTree[p]={};db.categoryTree[p][name]=[];
  }else if(level===3){
    const p=document.getElementById('newCatParent').value,p2=document.getElementById('newCatParent2').value;
    if(!p||!p2){showToast('请选择完整父级分类');return}
    if(!db.categoryTree[p])db.categoryTree[p]={};
    if(!db.categoryTree[p][p2])db.categoryTree[p][p2]=[];
    db.categoryTree[p][p2].push(name);
  }
  addAuditLog(db,'新增资产分类','层级:'+level+',名称:'+name);
  saveDB(db);closeModal();showToast('分类添加成功 ✅');renderCategoryTree();
}

function saveFlowConfig(){
  const cat=document.getElementById('flowCategory').value;
  if(!cat){showToast('请选择资产分类');return}
  const nodes=[];let i=0;
  while(true){const el=document.getElementById('flowNode_'+i);if(!el)break;nodes.push(el.value||'审批人');i++}
  if(nodes.length<2){showToast('至少需要2个审批节点');return}
  const db=getDB();db.approvalFlows[cat]={nodes};
  addAuditLog(db,'配置审批流','分类:'+cat+',节点:'+nodes.join('→'));
  saveDB(db);showToast('审批流配置已保存 ✅');
}

// ===== L3: AUDIT LOGS =====
function renderAuditLogs(){
  const db=getDB(),el=document.getElementById('auditLogList');
  if(db.auditLogs.length===0){el.innerHTML='<div class="empty-state"><div class="icon">📜</div><div>暂无审计日志</div></div>';return}
  el.innerHTML=db.auditLogs.map(log=>'<div class="approval-item"><div class="approval-info"><div class="approval-title">'+log.action+'</div><div class="approval-meta">'+log.user+' · '+log.time+'<br>'+log.detail+'</div></div></div>').join('');
}

// ===== L3: ADMIN MANAGEMENT =====
function renderAdminMgmt(){
  const db=getDB();
  if(!db.permissions)db.permissions={admins:[],superAdmins:['艾培刚']};
  const saEl=document.getElementById('superAdminList');
  saEl.innerHTML=db.permissions.superAdmins.map((n,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff1f0;border-radius:6px;margin-bottom:4px"><span>👑 '+n+'</span><button class="btn btn-danger btn-sm" onclick="removeSuperAdmin('+i+')">移除</button></div>').join('');
  const adEl=document.getElementById('adminList');
  adEl.innerHTML=db.permissions.admins.map((n,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#e6f7ff;border-radius:6px;margin-bottom:4px"><span>🔧 '+n+'</span><button class="btn btn-danger btn-sm" onclick="removeAdmin('+i+')">移除</button></div>').join('');
}
function addSuperAdmin(){
  openModal('<div class="modal-title">添加超管<button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label class="form-label">请输入人员姓名</label><input class="form-input" id="newSuperAdminName" placeholder="输入姓名"></div><button class="btn btn-primary btn-block" onclick="saveSuperAdmin()">确认添加</button>');
}
function saveSuperAdmin(){
  const name=document.getElementById('newSuperAdminName').value.trim();
  if(!name){showToast('请输入姓名');return}
  const db=getDB();if(!db.permissions)db.permissions={admins:[],superAdmins:['艾培刚']};
  if(db.permissions.superAdmins.includes(name)){showToast('该用户已是超管');return}
  db.permissions.superAdmins.push(name);
  db.permissions.admins=db.permissions.admins.filter(a=>a!==name);
  addAuditLog(db,'添加超管',name);saveDB(db);closeModal();showToast('添加成功 ✅');renderAdminMgmt();
}
function removeSuperAdmin(i){
  const db=getDB();const name=db.permissions.superAdmins[i];
  if(!confirm('确定移除超管「'+name+'」吗？'))return;
  db.permissions.superAdmins.splice(i,1);
  addAuditLog(db,'移除超管',name);saveDB(db);renderAdminMgmt();
}
function addAdmin(){
  openModal('<div class="modal-title">添加管理员<button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label class="form-label">请输入人员姓名</label><input class="form-input" id="newAdminName" placeholder="输入姓名"></div><button class="btn btn-primary btn-block" onclick="saveAdmin()">确认添加</button>');
}
function saveAdmin(){
  const name=document.getElementById('newAdminName').value.trim();
  if(!name){showToast('请输入姓名');return}
  const db=getDB();if(!db.permissions)db.permissions={admins:[],superAdmins:['艾培刚']};
  if(db.permissions.admins.includes(name)||db.permissions.superAdmins.includes(name)){showToast('该用户已有权限');return}
  db.permissions.admins.push(name);
  addAuditLog(db,'添加管理员',name);saveDB(db);closeModal();showToast('添加成功 ✅');renderAdminMgmt();
}
function removeAdmin(i){
  const db=getDB();const name=db.permissions.admins[i];
  if(!confirm('确定移除管理员「'+name+'」吗？'))return;
  db.permissions.admins.splice(i,1);
  addAuditLog(db,'移除管理员',name);saveDB(db);renderAdminMgmt();
}

// ===== QR CODE PRINT (精臣适配) =====
function printAssetLabel(id){
  const db=getDB(),asset=db.assets.find(x=>x.id===id);
  if(!asset){showToast('资产不存在');return}
  openModal('<div class="modal-title">🖨️ 打印资产标签<button class="modal-close" onclick="closeModal()">✕</button></div>'+
    '<div id="labelPreview" style="text-align:center;padding:20px;background:#fff;border:1px dashed #ccc;border-radius:8px;margin-bottom:16px">'+
    '<div id="qrcodeContainer" style="margin:0 auto 12px;width:120px;height:120px"></div>'+
    '<div style="font-size:14px;font-weight:600">'+asset.name+'</div>'+
    '<div style="font-size:12px;color:#666">编号: '+asset.code+'</div>'+
    '<div style="font-size:12px;color:#666">存放: '+asset.location+'</div>'+
    '<div style="font-size:12px;color:#666">使用人: 艾培刚</div></div>'+
    '<button class="btn btn-primary btn-block" onclick="doPrintLabel('+id+')">🖨️ 发送到精臣打印机</button>');
  setTimeout(()=>{try{new QRCode(document.getElementById('qrcodeContainer'),{text:asset.code,width:120,height:120,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}catch(e){}},200);
}
function doPrintLabel(id){
  const db=getDB(),asset=db.assets.find(x=>x.id===id);
  if(!asset)return;
  showToast('打印任务已发送（精臣云打印适配中）');
  addAuditLog(db,'打印资产标签','编号:'+asset.code);
  saveDB(db);
}

// ===== INIT =====
(function initDemo(){
  const db=getDB();
  if(db.assets.length>0)return;
  // 从三级分类生成示例资产
  const tree=db.categoryTree;

      l3List.forEach(l3=>{

        const sts=['在用','闲置','维修中','已报废'];
        db.assets.push({id:db.nextAssetId++,name:l3,code,category:l1,categorySub:l2,location:locs[seq%locs.length],status:sts[seq%sts.length],images:[],createdAt:Date.now()});
      });
    });
  });
  db.approvals.push({id:db.nextApprovalId++,type:'领用',assetId:1,assetName:'ThinkPad笔记本',qty:1,purpose:'项目使用',note:'',applicant:'艾培刚',status:'待审批',time:new Date().toLocaleString('zh-CN'),createdAt:Date.now()});
  saveDB(db);
})();

// ===== L2 TAB SWITCH =====
function switchL2Tab(t,b){
  document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));
  if(b)b.classList.add('active');
  ['dashboard','approvals','assets','records'].forEach(p=>document.getElementById('l2-'+p).style.display=p===t?'block':'none');
  if(t==='dashboard')renderCharts();
  if(t==='approvals')renderApprovals();
  if(t==='assets')renderAssetTable();
  if(t==='records')renderRecords();
}
